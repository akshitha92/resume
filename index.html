<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Akshitha | ECE Portfolio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

/* =========================================================
   BASIC SETTINGS
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    scroll-behavior: smooth;
}

:root {
    --blue: #00c8ff;
    --purple: #8b5cf6;
    --pink: #d946ef;
    --dark: #020617;
    --card: rgba(7, 20, 45, 0.70);
    --text: #e5f4ff;
}

body {
    font-family: "Poppins", sans-serif;
    background: #020617;
    color: var(--text);
    overflow-x: hidden;
}


/* =========================================================
   ANIMATED ECE BACKGROUND
========================================================= */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -5;

    background:
        radial-gradient(circle at 15% 20%, rgba(0,200,255,0.15), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(139,92,246,0.18), transparent 25%),
        radial-gradient(circle at 50% 90%, rgba(217,70,239,0.12), transparent 25%),
        #020617;
}


/* Circuit lines */

.circuit {
    position: fixed;
    inset: 0;
    z-index: -3;
    pointer-events: none;
    opacity: 0.45;
}

.circuit span {
    position: absolute;
    background: linear-gradient(90deg, transparent, #00c8ff, transparent);
    height: 1px;
    width: 250px;
    animation: circuitMove 5s linear infinite;
}

.circuit span:nth-child(1) {
    top: 18%;
    left: -250px;
}

.circuit span:nth-child(2) {
    top: 42%;
    left: -250px;
    animation-delay: 1s;
}

.circuit span:nth-child(3) {
    top: 70%;
    left: -250px;
    animation-delay: 2s;
}

.circuit span:nth-child(4) {
    top: 85%;
    left: -250px;
    animation-delay: 3s;
}

@keyframes circuitMove {
    0% {
        transform: translateX(0);
    }

    100% {
        transform: translateX(150vw);
    }
}


/* =========================================================
   NAVBAR
========================================================= */

nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 18px 7%;

    background: rgba(2, 6, 23, 0.72);
    backdrop-filter: blur(18px);

    border-bottom: 1px solid rgba(0,200,255,0.3);

    z-index: 1000;
}

.logo {
    font-family: "Orbitron", sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: white;
}

.logo span {
    color: var(--blue);
    text-shadow: 0 0 15px var(--blue);
}

nav ul {
    display: flex;
    list-style: none;
    gap: 28px;
}

nav a {
    text-decoration: none;
    color: #cbd5e1;
    font-size: 14px;
    transition: 0.3s;
}

nav a:hover {
    color: var(--blue);
    text-shadow: 0 0 10px var(--blue);
}


/* =========================================================
   HERO SECTION
========================================================= */

.hero {
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 120px 8% 70px;

    position: relative;
}

.hero-container {
    width: 100%;
    max-width: 1200px;

    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    gap: 60px;
}


/* Hero text */

.small-title {
    color: var(--blue);
    font-size: 14px;
    letter-spacing: 3px;
    margin-bottom: 15px;
}

.hero h1 {
    font-family: "Orbitron", sans-serif;
    font-size: clamp(45px, 7vw, 85px);
    line-height: 1;

    color: white;

    text-shadow:
        0 0 10px rgba(0,200,255,0.5),
        0 0 35px rgba(139,92,246,0.4);
}

.hero h1 span {
    background: linear-gradient(
        90deg,
        #00c8ff,
        #8b5cf6,
        #d946ef
    );

    -webkit-background-clip: text;
    color: transparent;
}

.hero h3 {
    margin-top: 20px;
    font-size: 22px;
    color: #a5f3fc;
}

.hero p {
    margin-top: 20px;
    max-width: 600px;
    color: #cbd5e1;
    line-height: 1.8;
}


/* =========================================================
   BUTTONS
========================================================= */

.buttons {
    margin-top: 30px;
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.btn {
    padding: 13px 25px;

    border-radius: 30px;

    text-decoration: none;

    color: white;

    border: 1px solid var(--blue);

    background: rgba(0,200,255,0.1);

    box-shadow:
        0 0 10px rgba(0,200,255,0.3),
        inset 0 0 10px rgba(0,200,255,0.05);

    transition: 0.35s;
}

.btn:hover {
    transform: translateY(-5px) scale(1.04);

    background: linear-gradient(
        90deg,
        #00c8ff,
        #8b5cf6
    );

    box-shadow:
        0 0 20px #00c8ff,
        0 0 40px #8b5cf6;
}

.btn.secondary {
    border-color: #8b5cf6;
}


/* =========================================================
   3D CHIP
========================================================= */

.chip-container {
    display: flex;
    justify-content: center;
    align-items: center;

    perspective: 1000px;
}

.chip {
    width: 300px;
    height: 300px;

    position: relative;

    transform-style: preserve-3d;

    animation: chipFloat 5s ease-in-out infinite;

    display: flex;
    align-items: center;
    justify-content: center;
}

@keyframes chipFloat {
    0%,100% {
        transform: rotateY(-10deg) rotateX(8deg) translateY(0);
    }

    50% {
        transform: rotateY(10deg) rotateX(-8deg) translateY(-20px);
    }
}


/* PCB */

.chip-core {
    width: 180px;
    height: 180px;

    background:
        repeating-linear-gradient(
            45deg,
            #071c35,
            #071c35 8px,
            #0b2947 8px,
            #0b2947 10px
        );

    border: 3px solid #00c8ff;

    box-shadow:
        0 0 20px #00c8ff,
        0 0 60px rgba(0,200,255,0.7),
        inset 0 0 30px rgba(0,200,255,0.3);

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;
}

.chip-core::before {
    content: "ECE";

    font-family: "Orbitron", sans-serif;

    font-size: 35px;
    font-weight: 800;

    color: white;

    text-shadow:
        0 0 10px #00c8ff,
        0 0 25px #00c8ff;
}


/* Chip pins */

.pin {
    position: absolute;

    width: 55px;
    height: 5px;

    background: #fbbf24;

    box-shadow: 0 0 10px #fbbf24;
}

.pin.left {
    left: -55px;
}

.pin.right {
    right: -55px;
}

.pin.top {
    width: 5px;
    height: 55px;
    top: -55px;
}

.pin.bottom {
    width: 5px;
    height: 55px;
    bottom: -55px;
}

.pin:nth-child(1) { top: 20px; }
.pin:nth-child(2) { top: 55px; }
.pin:nth-child(3) { top: 90px; }
.pin:nth-child(4) { top: 125px; }


/* Outer ring */

.chip-ring {
    position: absolute;

    width: 350px;
    height: 350px;

    border: 1px solid rgba(0,200,255,0.7);

    border-radius: 50%;

    box-shadow:
        0 0 25px rgba(0,200,255,0.5),
        inset 0 0 25px rgba(139,92,246,0.3);

    animation: spin 12s linear infinite;
}

.chip-ring::after {
    content: "";

    position: absolute;

    width: 15px;
    height: 15px;

    border-radius: 50%;

    background: #00c8ff;

    box-shadow: 0 0 20px #00c8ff;

    top: -7px;
    left: 50%;
}

@keyframes spin {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}


/* =========================================================
   SECTION
========================================================= */

section {
    padding: 100px 8%;
    position: relative;
}

.section-title {
    text-align: center;
    margin-bottom: 55px;
}

.section-title h2 {
    font-family: "Orbitron", sans-serif;
    font-size: 35px;
}

.section-title span {
    color: var(--blue);
    text-shadow: 0 0 15px var(--blue);
}

.section-title p {
    color: #64748b;
    margin-top: 10px;
}


/* =========================================================
   GLASS CARD
========================================================= */

.glass {
    background: var(--card);

    border: 1px solid rgba(0,200,255,0.25);

    border-radius: 20px;

    backdrop-filter: blur(15px);

    box-shadow:
        0 10px 40px rgba(0,0,0,0.3),
        inset 0 0 30px rgba(0,200,255,0.03);

    transition: 0.4s;
}

.glass:hover {
    transform: translateY(-10px) rotateX(2deg);

    border-color: rgba(0,200,255,0.8);

    box-shadow:
        0 20px 50px rgba(0,200,255,0.15),
        0 0 25px rgba(0,200,255,0.15);
}


/* =========================================================
   ABOUT
========================================================= */

.about-container {
    max-width: 1100px;
    margin: auto;

    display: grid;
    grid-template-columns: 1.5fr 1fr;

    gap: 30px;
}

.about-card {
    padding: 35px;
}

.about-card h3 {
    color: var(--blue);
    margin-bottom: 15px;
}

.about-card p {
    color: #cbd5e1;
    line-height: 1.8;
}

.about-info {
    padding: 35px;
}

.info-item {
    margin-bottom: 22px;
}

.info-item span {
    color: #64748b;
    font-size: 13px;
}

.info-item strong {
    display: block;
    margin-top: 4px;
    color: white;
}


/* =========================================================
   EDUCATION
========================================================= */

.education {
    max-width: 1000px;
    margin: auto;

    display: grid;
    grid-template-columns: repeat(3,1fr);

    gap: 25px;
}

.edu-card {
    padding: 30px;
    text-align
